name: volume_breakout
display_name: Rompimento c/ Volume
description: Detecta rompimento de nível de resistência acompanhado de alto volume
  de negociação.
category: trend
core_rules:
  - 1
  - 2
  - 3
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases:
  - 放量突破
  - 突破
default_priority: 30
market_regimes:
  - trending_up
instructions: "**放量突破（Volume Breakout Strategy）**\n\n突破判定标准：\n\n1. **阻力位识别**：\n  \
  \ - 使用 `analyze_trend` → resistance_levels 获取阻力位。\n   - 通常为 20 日高点或前期震荡平台顶部。\n\n\
  2. **量能确认**（关联理念3：效率优先）：\n   - 当日成交量 > 5 日均量的 2 倍。\n   - 使用 `get_realtime_quote`\
  \ → volume_ratio > 2.0 确认。\n   - 使用 `get_daily_history` 计算均量进行交叉验证。\n\n3. **价格确认**（关联理念1：严进策略）：\n\
  \   - 收盘价必须站上阻力位。\n   - 收盘应在当日振幅上方 30%（强势收盘）。\n   - 突破后乖离率检查：仍需 < 5%，避免追高。\n\n4.\
  \ **后续验证**（如有数据）：\n   - 次日开盘应在突破位之上，区分真突破与假突破。\n\n5. **风险过滤**（关联理念5：风险排查）：\n   -\
  \ 通过 `search_stock_news` 检查无重大利空。\n   - PE 不应过高（避免泡沫型突破）。\n\n评分调整：\n- 放量突破确认：sentiment_score\
  \ +12\n- 突破伴随板块共振（板块也走强）：额外 +5\n- 理想买点设在突破位附近，止损设在突破位下方 3%。\n- 在 `buy_reason` 和\
  \ `volume_analysis` 中注明\"放量突破\"。\n"
