name: dragon_head
display_name: Ações Líderes
description: Identifica a ação líder em rotação de setor. Aplicável quando um setor
  inicia movimento.
category: trend
core_rules:
  - 2
  - 7
required_tools:
  - get_realtime_quote
  - get_sector_rankings
  - search_stock_news
aliases:
  - 龙头
  - 龙头战法
default_priority: 90
market_regimes:
  - sector_hot
instructions: "**龙头策略（Dragon Head Strategy）**\n\n评估标准：\n\n1. **板块领涨地位**：\n   - 使用\
  \ `get_sector_rankings` 检查该股所在板块是否为近期涨幅前列。\n   - 确认该股是否在板块启动周期中率先上涨或涨停。\n\n2. **换手率与动能**（关联理念7：强势趋势股放宽）：\n\
  \   - 使用 `get_realtime_quote` 检查换手率。龙头股换手率通常 > 5%。\n   - 量比 > 1.5 说明有活跃的交易兴趣。\n\n\
  3. **相对强度**：\n   - 对比个股涨跌幅与板块平均值。\n   - 真正的龙头在上涨日应跑赢板块 2% 以上。\n\n4. **新闻催化**：\n\
  \   - 使用 `search_stock_news` 搜索板块级催化剂（政策、事件、业绩）。\n   - 龙头行情常伴随板块整体催化。\n\n5. **乖离率检查**（关联理念1：严进策略）：\n\
  \   - 龙头股可适当放宽乖离率至 7%，但超过 10% 仍需谨慎。\n\n评分调整：\n- 确认为龙头股：sentiment_score +10\n- 板块正处于主动轮动期：额外\
  \ +5\n- 在 `buy_reason` 中注明\"龙头策略\"判断结果。\n"
