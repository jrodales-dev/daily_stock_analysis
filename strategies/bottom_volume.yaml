name: bottom_volume
display_name: Volume no Fundo (Bottom Volume)
description: Detecta sinais de volume elevado no fundo após queda prolongada, sinalizando
  reversão de tendência.
category: reversal
core_rules:
  - 2
  - 5
required_tools:
  - get_daily_history
  - analyze_trend
aliases:
  - 地量见底
  - 底部放量
default_priority: 60
market_regimes:
  - trending_down
instructions: "**底部放量（Bottom Volume Surge Strategy）**\n\n反转判定标准：\n\n1. **持续下跌确认**：\n\
  \   - 使用 `get_daily_history`（30日）。\n   - 股价从 20 日高点到近期低点跌幅 > 15%。\n   - `analyze_trend`\
  \ → trend_status 应为 BEAR 或 STRONG_BEAR。\n\n2. **量能异动**：\n   - 当日成交量 > 5 日均量的 3 倍。\n\
  \   - 使用 `get_realtime_quote` → volume_ratio > 3.0。\n   - 该异动应出现在前期极度缩量之后。\n\n3.\
  \ **价格企稳**：\n   - 当日K线收阳（收盘价 > 开盘价）。\n   - 价格守住近期低点。\n   - 最好出现长下影线，显示买方支撑。\n\n\
  4. **确认因素**（关联理念5：风险排查）：\n   - 通过 `search_stock_news` 确认是否有基本面催化。\n   - 筹码分布：平均成本接近现价（成本收敛）。\n\
  \n5. **风险提示**（关联理念2：趋势交易）：\n   - 这是反转信号，风险高于趋势跟踪。\n   - 仓位建议较小（最多 2-3 成）。\n   -\
  \ 止损必须严格（设在近期低点下方）。\n\n评分调整：\n- 底部放量确认：sentiment_score +8\n- 配合阳线 + 新闻催化：额外 +5\n\
  - 在 `buy_reason` 和 `pattern_analysis` 中注明\"底部放量\"。\n- 止损设在近期低点。\n"
