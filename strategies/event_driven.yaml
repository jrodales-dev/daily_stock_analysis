name: event_driven
display_name: Orientado a Eventos
description: Analisa força catalisadora em torno de lucros, políticas, lançamentos
  de produtos e fusões/aquisições.
category: framework
core_rules:
  - 3
  - 5
required_tools:
  - search_stock_news
  - get_realtime_quote
  - analyze_trend
aliases:
  - 事件驱动
  - 催化
  - 催化事件
default_priority: 45
market_regimes:
  - sector_hot
  - volatile
instructions: "**事件驱动策略（Event Driven Strategy）**\n\n适用场景：\n- 公司或行业出现明确事件催化，如业绩预告、订单中标、并购重组、政策落地、产品发布、监管处罚、诉讼等。\n\
  - 需要判断事件是短期交易催化、长期基本面改善，还是利好兑现。\n\n分析框架：\n\n1. **事件分类**\n   - 使用 `search_stock_news`\
  \ 梳理近期关键事件。\n   - 将事件分为：业绩类、政策类、订单/产品类、资本运作类、监管/风险类。\n   - 明确事件发生时间，过期或时间未知的信息不能作为主要依据。\n\
  \n2. **影响路径**\n   - 判断事件影响的是收入、利润率、估值、融资能力、市场份额，还是仅影响情绪。\n   - 对重大订单或政策利好，要说明兑现周期和不确定性。\n\
  \   - 对监管、减持、处罚、诉讼等事件，风险优先。\n\n3. **市场反应**\n   - 使用 `get_realtime_quote` 和 `analyze_trend`\
  \ 判断事件是否已被价格充分反映。\n   - 放量上涨但未过关键阻力，可等待确认。\n   - 高位放量滞涨或利好后冲高回落，应警惕兑现压力。\n\n4. **交易计划**\n\
  \   - 事件未兑现前，强调仓位控制和时间窗口。\n   - 事件兑现后，重新评估是否从“预期交易”切换为“业绩验证”。\n   - 对负面事件，先看风险释放是否充分，再考虑反弹。\n\
  \n输出要求：\n- 明确事件性质：利好 / 利空 / 中性 / 不确定。\n- 给出事件可信度、兑现周期、已反映程度。\n- 操作建议必须包含失效条件，如公告不及预期、跌破关键支撑或事件热度消退。\n\
  \n评分调整建议：\n- 高可信正向事件且价格尚未充分反映：`sentiment_score +14`\n- 正向事件已大幅兑现：`sentiment_score\
  \ -6`\n- 负面事件仍在发酵：`sentiment_score -15`\n- 事件影响不清晰或信息冲突：维持中性并降低置信度\n"
