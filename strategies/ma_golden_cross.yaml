name: ma_golden_cross
display_name: Cruzamento de Ouro MA
description: Detecta cruzamento de médias móveis apoiado em volume, um clássico sinal
  de continuação/reversão.
category: trend
core_rules:
  - 1
  - 2
  - 3
required_tools:
  - get_daily_history
  - analyze_trend
aliases:
  - 均线金叉
  - 金叉
default_priority: 20
market_regimes:
  - trending_up
instructions: "**均线金叉（MA Golden Cross Strategy）**\n\n信号判定标准：\n\n1. **金叉检测**（关联理念2：趋势交易）：\n\
  \   - 使用 `analyze_trend` 检查均线排列和 MACD 状态。\n   - 主信号：MA5 在最近 3 个交易日内上穿 MA10。\n  \
  \ - 强信号：MA10 上穿 MA20（更慢但更可靠）。\n   - 检查 MACD 状态是否为金叉或零轴上方金叉。\n\n2. **量能确认**（关联理念3：效率优先）：\n\
  \   - 金叉日成交量应高于 5 日均量。\n   - 使用 `get_daily_history` 验证。\n   - 金叉日量比 > 1.2 为积极信号。\n\
  \n3. **趋势背景**：\n   - 盘整后金叉：最强信号。\n   - 上升趋势中金叉：延续信号。\n   - 深度下跌中金叉：弱信号，需更多确认。\n\n\
  4. **价格位置**（关联理念1：严进策略）：\n   - 价格应在交叉均线附近或上方。\n   - 乖离率 < 5% — 避免追高延迟入场。\n\n评分调整：\n\
  - MA5 × MA10 金叉配合量能：sentiment_score +10\n- MA10 × MA20 金叉：sentiment_score +8\n-\
  \ MACD 零轴上方金叉：额外 +5\n- 在 `ma_analysis` 和 `buy_reason` 中注明\"均线金叉\"。\n- 理想买点设在交叉均线水平附近。\n"
