name: one_yang_three_yin
display_name: Um Yang Três Yin
description: Detecta padrão de candlestick onde um candle de alta sucede três de baixa,
  um sinal de continuação.
category: pattern
core_rules:
  - 2
  - 4
required_tools:
  - get_daily_history
  - analyze_trend
aliases:
  - 一阳穿三阴
  - 一阳夹三阴
default_priority: 110
instructions: "**一阳夹三阴（One Yang Three Yin Strategy）**\n\n形态定义（最近 5 个交易日）：\n\n1. **第1日**：大阳线（收盘价\
  \ > 开盘价，实体 > 股价的 2%）。\n2. **第2-4日**：连续三根阴线或小K线：\n   - 每根K线最低价不跌破第1日开盘价。\n   - 成交量应逐步萎缩（量比\
  \ < 0.8）。\n   - 三根K线应收在第1日实体范围内。\n3. **第5日**：又一根阳线，收盘价突破第1日收盘价。\n\n如何使用工具评估：\n\n\
  1. 使用 `get_daily_history` 获取最近 10 日数据。\n2. 检查最后 5 根K线是否符合上述形态。\n3. 使用 `analyze_trend`\
  \ 确认多头排列（关联理念2：趋势交易，MA5 > MA10 > MA20）。\n\n评分调整：\n- 形态成立 + 趋势看多：sentiment_score\
  \ +15\n- 形态成立但趋势不明：sentiment_score +5\n- 在 `pattern_analysis` 和 `buy_reason` 中注明\"\
  一阳夹三阴\"。\n- 理想买点设在第5日收盘价附近，止损设在第1日开盘价下方。\n"
